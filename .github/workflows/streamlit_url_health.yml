name: URL Health

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 1 * *'  # 每月 1 日 09:00 UTC（台灣時間 17:00）

jobs:

    build:

        runs-on: ubuntu-latest

        steps:
        - name: Check mmm-explainer
          uses: jtalk/url-health-check-action@v5
          with:
            url: https://pymc-marketing-app.streamlit.app/
            follow-redirect: false
            max-attempts: 3
            retry-delay: 5s

        - name: Check mmm-demo
          uses: jtalk/url-health-check-action@v5
          with:
            url: https://pymc-marketing-mmm.streamlit.app/
            follow-redirect: false
            max-attempts: 3
            retry-delay: 5s
